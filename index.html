    <!-- ══ Schema.org JSON-LD — FAQ ══ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Le premier rendez-vous est-il payant ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Non, le premier rendez-vous est entièrement offert et sans engagement. C'est l'occasion de faire connaissance, de comprendre votre situation et vos objectifs, et de voir si mon accompagnement vous correspond."
          }
        },
        {
          "@type": "Question",
          "name": "Combien coûte un accompagnement ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Le tarif dépend de la formule choisie et du temps nécessaire à votre situation. Il vous est communiqué à l'issue du premier rendez-vous, qui est offert : vous savez exactement ce que vous engagez avant de décider, sans surprise."
          }
        },
        {
          "@type": "Question",
          "name": "Faut-il avoir un patrimoine pour être accompagné ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Non, absolument pas. On peut commencer par reprendre son budget en main ou par comprendre les bases de la finance, sans aucun capital de départ. Que vous ayez 500 € d'épargne ou un patrimoine constitué, il existe un accompagnement adapté à votre situation."
          }
        },
        {
          "@type": "Question",
          "name": "Êtes-vous vraiment indépendante des banques ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Absolument. Je ne suis affiliée à aucune banque ni assureur. Je suis libre de comparer l'ensemble du marché et de vous recommander uniquement ce qui sert vos intérêts, sans objectif commercial à atteindre."
          }
        },
        {
          "@type": "Question",
          "name": "Les placements que vous proposez sont-ils risqués ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Tout investissement comporte un niveau de risque. Mon rôle est de vous présenter clairement le rapport risque/rendement de chaque solution et de vous proposer des options parfaitement adaptées à votre profil et vos objectifs."
          }
        },
        {
          "@type": "Question",
          "name": "Comment se déroulent les rendez-vous ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Les rendez-vous peuvent avoir lieu en présentiel partout dans l'Ain, ou à distance par visioconférence. Je m'adapte à vos disponibilités et à votre préférence."
          }
        },
        {
          "@type": "Question",
          "name": "Combien de temps dure un accompagnement ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "La relation est pensée sur le long terme. Après la mise en place de votre stratégie, nous faisons des bilans réguliers (annuels ou à chaque événement de vie) pour adapter vos placements à l'évolution de votre situation."
          }
        }
      ]
    }
